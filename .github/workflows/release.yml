name: Release

# Publishes to npm and creates GitHub Releases, keeping npmjs and GitHub in sync.
#
# Two triggers:
#   1. push to main  -> if package.json version is not yet on npm, publish it,
#                       then tag v<version> and create a GitHub Release.
#   2. push tag v*   -> re-validates (build + tests), skips publish if the
#                       version already exists, and creates/updates the
#                       GitHub Release (used for manual tagging).
#
# Versioning: bump `version` in package.json AND run `pnpm changeset version`
# to consume pending changesets in the same PR; the merge to main triggers the
# publish automatically.

on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # Version may already exist (e.g. first release published manually).
      # Skip publishing in that case; the GitHub Release is still created.
      - name: Check npm version existence
        id: npm-version-check
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view warpweave@$VERSION version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm-version-check.outputs.exists == 'false'
        # --no-git-checks: on a tag push the checkout is on a detached HEAD,
        # which pnpm would otherwise reject against its publish-branch default.
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # On a main push with a new version: tag v<version> and create the
      # GitHub Release right away (gh API-created tags do not re-trigger this
      # workflow, so no infinite loop).
      - name: Tag version and create GitHub Release
        if: github.ref == 'refs/heads/main' && steps.npm-version-check.outputs.exists == 'false'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" \
            --title "warpweave v$VERSION" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Manual tag push (v*): create/update the GitHub Release with
      # auto-generated notes.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
