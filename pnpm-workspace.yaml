# pnpm >=9 reads its settings (including `overrides`) from here instead of the
# `pnpm` field in package.json. Keeping the brace-expansion security override
# here ensures it is actually applied rather than silently ignored.
packages:
  - '.'

# brace-expansion < 5.0.8 has a ReDoS vulnerability (GHSA-2h4g-9f3r-4cqc).
# Force a patched version wherever it is pulled in transitively.
overrides:
  brace-expansion@<=5.0.7: '>=5.0.8'
